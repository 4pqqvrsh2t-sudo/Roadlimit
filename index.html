<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Car HUD">
  <title>Car HUD</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">WINDSHIELD DISPLAY</div>
      <h1>Car HUD</h1>
    </header>

    <section class="readout">
      <div id="speed" class="speed">--</div>
      <div class="mph">MPH</div>
      <div class="limit-row">
        <span>LIMIT</span>
        <strong id="limit">--</strong>
      </div>
      <div id="road" class="road">Waiting to start</div>
    </section>

    <section class="controls">
      <label class="field">
        <span>HERE API key</span>
        <input id="apiKey" type="password" autocomplete="off" placeholder="Paste once">
      </label>

      <div class="buttons">
        <button id="connectBtn">Connect HUD</button>
        <button id="startBtn" class="primary">Start</button>
      </div>

      <div class="status-grid">
        <div><span>GPS</span><strong id="gpsStatus">OFF</strong></div>
        <div><span>HUD</span><strong id="bleStatus">OFF</strong></div>
        <div><span>LIMIT DATA</span><strong id="limitStatus">OFF</strong></div>
      </div>
    </section>

    <p class="note">Posted road signs control. Digital speed-limit data can be missing, delayed, or outdated.</p>
  </main>
</body>
</html>
